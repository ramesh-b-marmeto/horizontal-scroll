<div style="height: 100vh; background: lightgray;">Scroll down...</div>

<div id="horizontalScroll" style="height: 50vh; overflow-x: auto; overflow-y: hidden; white-space: nowrap; display: flex;">
  <div style="min-width: 100vw; background: salmon;">Item 1</div>
  <div style="min-width: 100vw; background: lightblue;">Item 2</div>
  <div style="min-width: 100vw; background: lightgreen;">Item 3</div>
</div>

<div style="height: 100vh; background: lightgray;">You're past the horizontal section.</div>

<script>
  const scrollContainer = document.getElementById('horizontalScroll');
  let isActive = false;

  // Watch when the section is mostly visible
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      isActive = entry.isIntersecting && entry.intersectionRatio >= 0.9;
    });
  }, {
    root: null,
    threshold: 0.9
  });

  observer.observe(scrollContainer);

  // Helper to check if section is scrollable left or right
  function canScrollHorizontally(container, delta) {
    const atStart = container.scrollLeft <= 0 && delta < 0;
    const atEnd = container.scrollLeft + container.clientWidth >= container.scrollWidth && delta > 0;
    return !(atStart || atEnd);
  }

  // Handle wheel (desktop)
  window.addEventListener("wheel", (e) => {
    if (isActive && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      if (canScrollHorizontally(scrollContainer, e.deltaY)) {
        scrollContainer.scrollLeft += e.deltaY;
        document.body.style.overflow = "hidden"; // Lock vertical scrolling
        window.scrollTo(0, scrollContainer.offsetTop - 150);
        e.preventDefault();
      }
      else {
        document.body.style.overflow = "auto";
      }
    }
  }, { passive: false });

  // Handle touch (mobile)
  let startX = 0, startY = 0;
  window.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  });

  window.addEventListener("touchmove", (e) => {
    if (!isActive) return;

    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;

    if (Math.abs(dy) > Math.abs(dx)) {
      if (canScrollHorizontally(scrollContainer, -dy)) {
        scrollContainer.scrollLeft -= dy;
        e.preventDefault();
      }
    }

    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: false });
</script>
